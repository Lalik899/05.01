{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 bg-white p-4 rounded shadow-sm">
    <h3 class="mb-3">{{ "Вход" if mode == "login" else "Регистрация" }}</h3>
    <form method="post">
      <div class="mb-3"><label class="form-label">Логин</label><input type="text" name="login" class="form-control" required></div>
      {% if mode == "register" %}
      <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3">
        <label class="form-label">Роль</label>
        <select name="role_id" class="form-select">
          <option value="1">Заказчик</option>
          <option value="2">Исполнитель</option>
        </select>
      </div>
      {% endif %}
      <div class="mb-3"><label class="form-label">Пароль</label><input type="password" name="password" class="form-control" required></div>
      <button class="btn btn-primary w-100">{{ "Войти" if mode == "login" else "Зарегистрироваться" }}</button>
    </form>
  </div>
</div>
{% endblock %}
